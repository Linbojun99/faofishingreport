url: https://linbojun99.github.io/faofishingreport/

template:
  bootstrap: 5
  bslib:
    primary: "#0B2E5B"
    secondary: "#16A6B6"
    navbar-bg: "#0B2E5B"
    link-color: "#0A6F9C"
    code-color: "#0B5E80"

home:
  title: "faofishingreport: FAO capture statistics, charts and reports"
  description: >
    Analyse FAO Global Capture Production statistics by fishing area, country and
    species, and produce charts, maps and tables for reports in English or Chinese.
  sidebar:
    structure: [links, fao, license, citation, authors, dev]
    components:
      fao:
        title: Data sources
        text: |
          - [FAO](https://www.fao.org/home/en)
          - [FAOSTAT data](https://www.fao.org/faostat/en/#data)
          - [FAO Global Capture Production](https://www.fao.org/fishery/collection/capture/en)
          - [FAO fishery data files](https://www.fao.org/fishery/static/Data/)

          This package is not affiliated with FAO; the data come from FAO.

footer:
  structure:
    left: [developed_by, fao]
    right: [built_with]
  components:
    fao: >
      Data: [FAO](https://www.fao.org/home/en) ·
      [FAOSTAT](https://www.fao.org/faostat/en/#data) ·
      [Global Capture Production](https://www.fao.org/fishery/collection/capture/en).
      This package is not affiliated with FAO; the data come from FAO.
      本包与FAO无关联，数据来源为FAO。

navbar:
  bg: primary
  type: dark
  structure:
    left: [intro, reference, articles, news]
    right: [lang, search, github]
  components:
    intro:
      text: "🚀 Get started"
      href: articles/get-started.html
    articles:
      text: Articles
      menu:
      - text: "🎓 Tutorial: FAO area 61 from zero to a report"
        href: articles/tutorial-61.html
      - text: -------
      - text: "💾 FAO data: download and customise"
        href: articles/data.html
      - text: "🌊 Fishing area analysis"
        href: articles/fishing-areas.html
      - text: "🐟 Species and countries"
        href: articles/species-countries.html
      - text: "📈 Composition, stock status and trends"
        href: articles/status-trends.html
      - text: "🔍 Data quality, diversity and fleets"
        href: articles/quality-diversity-fleets.html
      - text: "🔬 Shocks, collapses, synchrony and fleets"
        href: articles/literature-analyses.html
      - text: "🌡️ Sea temperature and catch temperature"
        href: articles/sst-mtc.html
      - text: "🐠 FishBase and SeaLifeBase traits"
        href: articles/fishbase.html
      - text: "📉 CMSY++ stock assessment"
        href: articles/cmsy.html
      - text: "📝 Assessment report: Word, LaTeX and PDF"
        href: articles/report.html
      - text: "🎨 Customise charts and maps"
        href: articles/customise.html
      - text: -------
      - text: "🧩 Extensions: other FAO datasets"
      - text: "🚢 Trade and employment"
        href: articles/trade-employment.html
    lang:
      text: "中文"
      href: "#lang"
      aria-label: "Switch language / 切换语言"
    github:
      icon: fa-github
      href: https://github.com/Linbojun99/faofishingreport
      aria-label: GitHub

reference:
- title: "💾 FAO data"
  desc: Check for, download and load FAO Global Capture Production releases.
  contents:
  - check_fao_update
  - download_fao_data
  - load_fao_data
  - fao_data_info
  - fao_data_dir
- title: "🌊 Fishing areas"
  desc: Total catch, main species and main countries of an FAO fishing area.
  contents:
  - fishing_area_data
  - fishing_area_species
  - fishing_area_country
- title: "🐟 Species and countries"
  desc: Who catches a species, what a country catches, and a country's global catch.
  contents:
  - species_country
  - country_species
  - country_analysis
- title: "📊 Summary analyses"
  desc: Composition, stock status, trends, data quality, diversity and fleets.
  contents:
  - species_group_composition
  - stock_status
  - peak_trend
  - area_overview
  - data_quality
  - diversity_concentration
  - country_group_summary
  - regime_shift
  - coastal_distant
- title: "🔬 Literature-based analyses"
  desc: Analyses that follow published methods, each citing its sources.
  contents:
  - catch_shocks
  - collapse_analysis
  - catch_synchrony
  - distant_water_profile
  - compare_releases
  - pelagic_demersal
  - fao_pd_groups
- title: "🌡️ FishBase and temperature"
  desc: Species traits from FishBase and SeaLifeBase, sea surface temperature, and the mean temperature of the catch.
  contents:
  - check_fishbase_update
  - download_fishbase_data
  - fishbase_table
  - fishbase_match
  - fishbase_sources
  - fao_sst_products
  - download_sst_data
  - fao_area_sst
  - mean_temperature_catch
- title: "📉 CMSY++ stock assessment"
  desc: Catch-only stock assessment with the bundled CMSY++ code, FishBase priors and JAGS set up for the operating system.
  contents:
  - cmsy_area
  - cmsy_system
  - cmsy_setup
  - cmsy_jags_versions
  - cmsy_download_jags
  - cmsy_install_jags
  - cmsy_sources
  - cmsy_priors
  - cmsy_input
  - cmsy_defaults
  - cmsy_run
  - cmsy_plot
  - cmsy_forecast
  - cmsy_compare
  - cmsy_tables
- title: "📝 Reports"
  desc: A Word report of a fishing area, in Chinese or English, written from the results.
  contents:
  - fao_report
- title: "🧩 Extensions: other FAO datasets"
  desc: >
    FAO fishery statistics other than global capture production: catch by subarea and division
    from regional fishery bodies (also used by `pelagic_demersal(by = "division")` and
    `mean_temperature_catch(by = "division")`), trade and employment, and how they compare with
    the catch. Not part of the Word report.
  contents:
  - load_fao_divisions
  - load_fao_trade
  - catch_trade
  - fao_capture_groups
  - load_fao_employment
  - employment_summary
  - catch_per_fisher
- title: "🎨 Settings and language"
  desc: Chart style, map projection, colours, fonts and Chinese names.
  contents:
  - fao_settings
  - fao_font
  - fao_translate

