# CMSY++ on Windows, macOS and Linux, for each combination of R version and JAGS version listed
# by cmsy_jags_versions(): downloads the matching JAGS (and rjags 5 for JAGS 5) with
# cmsy_download_jags() (checksums checked), installs it, runs the CMSY tests with real CMSY++
# runs, and runs cmsy_area() on two species of FAO area 34. The output of each run is kept.
on:
  push:
    branches: [main, master, dev]
    paths:
      - 'R/cmsy_*.R'
      - 'inst/cmsy/**'
      - 'inst/extdata/cmsy_priors.csv'
      - 'tests/testthat/test-cmsy.R'
      - '.github/workflows/cmsy-cross-platform.yaml'
  pull_request:
    paths:
      - 'R/cmsy_*.R'
      - 'inst/cmsy/**'
      - 'tests/testthat/test-cmsy.R'
  workflow_dispatch:

name: CMSY-cross-platform

permissions: read-all

jobs:
  cmsy:
    runs-on: ${{ matrix.os }}
    name: CMSY++ on ${{ matrix.os }}, R ${{ matrix.r }}, JAGS ${{ matrix.jags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # JAGS 4 (default): the installer that cmsy_jags_versions() gives for each R version
          - {os: windows-latest, r: 'release', jags: 'recommended'}   # R 4.6 -> JAGS 4.3.2
          - {os: windows-latest, r: '4.4',     jags: 'recommended'}   # R 4.4 -> JAGS 4.3.1
          - {os: windows-latest, r: '4.3',     jags: 'recommended'}   # R 4.3 -> JAGS 4.3.1
          - {os: windows-latest, r: '4.2',     jags: 'recommended'}   # R 4.2 -> JAGS 4.3.1
          - {os: macos-latest,   r: 'release', jags: 'recommended'}   # R 4.6 -> JAGS 4.3.2
          - {os: macos-latest,   r: '4.2',     jags: 'recommended'}   # R 4.2 -> JAGS 4.3.1
          - {os: ubuntu-latest,  r: 'release', jags: 'recommended'}   # JAGS of the package manager
          # JAGS 5.0.0 with rjags 5-3 from SourceForge
          - {os: windows-latest, r: 'release', jags: 'latest'}
          - {os: macos-latest,   r: 'release', jags: 'latest'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FAOFISHINGREPORT_CMSY_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
            any::withr
            any::rjags
            any::R2jags
            any::coda
            any::gplots
            any::mvtnorm
            any::neuralnet
            any::conicfit
            any::patchwork
            any::MASS
            local::.

      - name: Show which JAGS this R version needs
        run: |
          print(faofishingreport::cmsy_jags_versions()[, c("system", "r_versions", "jags", "installer", "rjags", "this_computer")])
        shell: Rscript {0}

      - name: Download the matching JAGS (and rjags 5) with cmsy_download_jags()
        if: runner.os != 'Linux'
        run: |
          files <- faofishingreport::cmsy_download_jags(version = "${{ matrix.jags }}")
          print(files[, c("component", "version", "file", "verified")])
          installer <- files$path[files$component == "JAGS"]
          cat("JAGS_INSTALLER=", normalizePath(installer), "\n", sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          rjags <- files$path[files$component == "rjags"]
          if (length(rjags) == 1) cat("RJAGS_FILE=", normalizePath(rjags), "\n", sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
        shell: Rscript {0}

      - name: Install JAGS (Windows, silent installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath "$env:JAGS_INSTALLER" -ArgumentList "/S" -Wait

      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: sudo installer -pkg "$JAGS_INSTALLER" -target /

      - name: Install JAGS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jags

      - name: Install rjags 5-3 for JAGS 5
        if: matrix.jags == 'latest'
        run: |
          path <- Sys.getenv("RJAGS_FILE")
          install.packages(path, repos = NULL, type = if (grepl("tar.gz$", path)) "source" else "binary")
          cat("rjags", as.character(packageVersion("rjags")), "\n")
        shell: Rscript {0}

      - name: Check the computer for CMSY++
        run: |
          sys <- faofishingreport::cmsy_system()
          print(sys$changes[, c("change", "applies_to")])
          if (is.na(sys$jags)) stop("JAGS was not found: ", sys$jags_message)
          if ("${{ matrix.jags }}" == "latest" && !startsWith(sys$jags, "5")) stop("JAGS 5 expected, found ", sys$jags)
          if (!all(sys$packages$ok)) stop("Missing R packages: ", paste(sys$packages$package[!sys$packages$ok], collapse = ", "))
        shell: Rscript {0}

      - name: Run the CMSY tests (with real CMSY++ runs)
        run: testthat::test_local(filter = "cmsy", reporter = "progress", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Run cmsy_area() on two species of FAO area 34
        run: |
          library(faofishingreport)
          fao_settings(dpi = 72)
          res <- cmsy_area("Atlantic, Eastern Central", species = c("Brachydeuterus auritus", "PIL"),
                           out_dir = "cmsy-ci", annotations = TRUE)
          print(res$summary[, c("Stock", "run_status", "first_year", "B_Bmsy", "F_Fmsy", "status", "seconds")])
          print(res$sources[, c("component", "version")])
          stopifnot(all(res$summary$run_status == "ok"))
          stopifnot(file.exists(file.path(res$dir, "figures", "GRB_34", "kobe.png")))
        shell: Rscript {0}

      - name: Keep the CMSY++ output of this system
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmsy-${{ matrix.os }}-R${{ matrix.r }}-JAGS-${{ matrix.jags }}
          path: cmsy-ci
          if-no-files-found: ignore
